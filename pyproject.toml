[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E711", "E712", "E731", "F401", "F841"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_any_generics = false
warn_unused_ignores = false
disable_error_code = ["assignment", "misc", "attr-defined", "index", "arg-type", "operator", "dict-item", "name-defined", "union-attr", "no-any-return", "type-arg"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "bcrypt.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["pruebas"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "migraciones/*"]

[tool.coverage.report]
fail_under = 70
